name: Update Homebrew Formula

on:
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to update formula for (e.g. 0.0.3)"
        required: true

jobs:
  update-formula:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(python -c 'import tomllib; print(tomllib.load(open(\"pyproject.toml\", \"rb\"))[\"project\"][\"version\"])')" >> $GITHUB_OUTPUT
          fi

      - name: Update Homebrew formula
        run: |
          uv run python scripts/brew_formula_update.py \
            --version "${{ steps.version.outputs.version }}" \
            --formula HomebrewFormula/review-classification.rb

      - name: Commit updated formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add HomebrewFormula/review-classification.rb
          git diff --staged --quiet || \
            git commit -m "chore: update Homebrew formula to v${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Push formula to homebrew tap repository
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/ghinks/homebrew-review-classification.git" \
            /tmp/homebrew-tap

          mkdir -p /tmp/homebrew-tap/Formula
          cp HomebrewFormula/review-classification.rb \
            /tmp/homebrew-tap/Formula/review-classification.rb

          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/review-classification.rb
          git diff --staged --quiet || \
            git commit -m "chore: update formula to v${{ steps.version.outputs.version }}"
          git push
